name: Finalize repository cleanup

on:
  push:
    branches: [main]
    paths:
      - '.finalize-cleanup-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary branch and maintenance files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git push origin --delete ops/readme-cleanup || true
          git push origin --delete skin/plan-a-v414 || true

          rm -f .finalize-cleanup-trigger
          rm -f .github/workflows/finalize-cleanup.yml
          rm -f .github/workflows/maintenance-readme-downloads.yml

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: finish repository cleanup'
            git push origin HEAD:main
          fi

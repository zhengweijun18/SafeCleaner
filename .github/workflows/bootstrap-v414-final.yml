name: Import v4.14 final source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository with v4.14
        shell: bash
        run: |
          set -euo pipefail

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.bootstrap' \
            ! -name '.github' \
            -exec rm -rf {} +

          cat .bootstrap/part-* > /tmp/v414.tar.gz.b64
          base64 -d /tmp/v414.tar.gz.b64 > /tmp/v414.tar.gz
          tar -xzf /tmp/v414.tar.gz -C "$GITHUB_WORKSPACE"

          rm -rf .bootstrap
          rm -rf .github

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish v4.14 cross-platform baseline'
          git push

name: Import v4.14 source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/v414.tar.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository with v4.14
        shell: bash
        run: |
          set -euo pipefail

          # Remove the previous repository payload while preserving Git metadata
          # and the bootstrap files needed by this running workflow.
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.bootstrap' \
            ! -name '.github' \
            -exec rm -rf {} +

          base64 -d .bootstrap/v414.tar.gz.b64 > /tmp/v414.tar.gz
          tar -xzf /tmp/v414.tar.gz -C "$GITHUB_WORKSPACE"

          # Bootstrap is one-shot; remove it and this workflow from the final tree.
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-v414.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish v4.14 cross-platform baseline'
          git push

name: One-off Windows metric layout fix

on:
  push:
    branches: [main]
    paths:
      - '.fix-windows-metric-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix metric card height
        shell: python
        run: |
          from pathlib import Path

          path = Path('Windows/MainWindow.xaml')
          text = path.read_text(encoding='utf-8')
          old = '<RowDefinition Height="80"/>'
          new = '<RowDefinition Height="Auto" MinHeight="88"/>'
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'Expected exactly one metric row definition, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .fix-windows-metric-trigger
          rm -f .github/workflows/fix-windows-metric.yml
          git add -A Windows/MainWindow.xaml .fix-windows-metric-trigger .github/workflows/fix-windows-metric.yml
          git commit -m 'fix: prevent Windows metric description clipping'
          git push origin HEAD:main

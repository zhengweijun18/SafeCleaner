name: One-off Windows source fix

on:
  push:
    branches: [main]
    paths:
      - '.fix-windows-source-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Windows compile blockers
        shell: python
        run: |
          from pathlib import Path
          import re

          xaml_path = Path('Windows/MainWindow.xaml')
          xaml = xaml_path.read_text(encoding='utf-8')
          xaml = re.sub(
              r'\n\s*<Border\.RenderTransform>\s*<ScaleTransform x:Name="Scale" ScaleX="1" ScaleY="1"/>\s*</Border\.RenderTransform>',
              '',
              xaml,
              flags=re.S,
          )
          xaml = re.sub(
              r'^\s*<Setter TargetName="Scale" Property="ScaleX" Value="[^"]+"/>\s*\n\s*<Setter TargetName="Scale" Property="ScaleY" Value="[^"]+"/>\s*\n',
              '',
              xaml,
              flags=re.M,
          )
          if 'TargetName="Scale"' in xaml or 'x:Name="Scale"' in xaml:
              raise RuntimeError('Scale trigger cleanup incomplete')
          xaml_path.write_text(xaml, encoding='utf-8')

          engine_path = Path('Windows/ScanEngine.cs')
          engine = engine_path.read_text(encoding='utf-8')
          if 'using System.IO;' not in engine:
              marker = 'using System.Security;\n'
              if marker not in engine:
                  raise RuntimeError('ScanEngine using marker not found')
              engine = engine.replace(marker, marker + 'using System.IO;\n', 1)
          engine_path.write_text(engine, encoding='utf-8')

          main_path = Path('Windows/MainWindow.xaml.cs')
          main = main_path.read_text(encoding='utf-8')
          old_progress = 'var progress = new Progress<ScanProgressInfo>(p =>'
          new_progress = 'IProgress<ScanProgressInfo> progress = new Progress<ScanProgressInfo>(p =>'
          if old_progress in main:
              main = main.replace(old_progress, new_progress, 1)
          elif new_progress not in main:
              raise RuntimeError('Progress declaration not found')

          old_metrics = '''                var checkedItems = data.Where(x => x.Checked && x.CanDelete).ToList();
                long selected = checkedItems.Sum(x => x.Size);

                MetricCandidate.Text = Format.Bytes(candidate);
                MetricCandidateSub.Text = "当前页面候选";
                MetricSelected.Text = Format.Bytes(selected);
                MetricSelectedSub.Text = $"{checkedItems.Count} 项将处理";'''
          new_metrics = '''                var selectedItems = data.Where(x => x.Checked && x.CanDelete).ToList();
                long selected = selectedItems.Sum(x => x.Size);

                MetricCandidate.Text = Format.Bytes(candidate);
                MetricCandidateSub.Text = "当前页面候选";
                MetricSelected.Text = Format.Bytes(selected);
                MetricSelectedSub.Text = $"{selectedItems.Count} 项将处理";'''
          if old_metrics in main:
              main = main.replace(old_metrics, new_metrics, 1)
          elif new_metrics not in main:
              raise RuntimeError('Metrics block not found')
          main_path.write_text(main, encoding='utf-8')

      - name: Commit source fix and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .fix-windows-source-trigger
          rm -f .github/workflows/fix-windows-source.yml
          git add -A Windows .fix-windows-source-trigger .github/workflows/fix-windows-source.yml
          git commit -m 'fix: make Windows WPF source compile on .NET 8'
          git push origin HEAD:main

name: Upload README hero image

on:
  push:
    branches:
      - main
      - 'skin/plan-a-v414'
    paths:
      - '.hero-upload/READY'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode README hero
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat .hero-upload/part-* | tr -d '\n' | base64 -d > docs/software-intro.jpg
          file docs/software-intro.jpg

      - name: Commit hero and clean bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hero-upload
          rm -f .github/workflows/upload-readme-hero.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: add software introduction image'
          git push

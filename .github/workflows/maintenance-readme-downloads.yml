name: One-off README maintenance

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  maintain:
    if: github.head_ref == 'ops/readme-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore full-resolution README hero and clean staging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat .readme-hero/part-* | base64 -d > docs/software-intro.webp
          test -s docs/software-intro.webp
          rm -f docs/software-intro.svg
          rm -rf .readme-hero README-HERO.ready

      - name: Restore permanent packaging workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/package-v414.yml <<'YAML'
          name: Build v4.14 download packages

          on:
            push:
              branches: [main]
              paths:
                - 'macOS/**'
                - 'Windows/**'
                - 'Shared/**'
                - 'README.md'
                - 'CHANGELOG.md'
                - '.github/workflows/package-v414.yml'
            workflow_dispatch:

          permissions:
            contents: write

          jobs:
            package:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - name: Build download ZIPs
                  shell: bash
                  run: |
                    set -euo pipefail
                    rm -rf downloads \
                      /tmp/SafeCleaner_v414_CrossPlatform \
                      /tmp/SafeCleaner_v414_macOS \
                      /tmp/SafeCleaner_v414_Windows

                    mkdir -p downloads \
                      /tmp/SafeCleaner_v414_CrossPlatform \
                      /tmp/SafeCleaner_v414_macOS \
                      /tmp/SafeCleaner_v414_Windows

                    cp -R macOS Windows Shared /tmp/SafeCleaner_v414_CrossPlatform/
                    cp README.md CHANGELOG.md /tmp/SafeCleaner_v414_CrossPlatform/
                    if [ -f .gitignore ]; then
                      cp .gitignore /tmp/SafeCleaner_v414_CrossPlatform/
                    fi

                    cp -R macOS/. /tmp/SafeCleaner_v414_macOS/
                    cp -R Windows/. /tmp/SafeCleaner_v414_Windows/

                    cd /tmp
                    zip -qry "$GITHUB_WORKSPACE/downloads/SafeCleaner_v414_CrossPlatform.zip" SafeCleaner_v414_CrossPlatform
                    zip -qry "$GITHUB_WORKSPACE/downloads/SafeCleaner_v414_macOS.zip" SafeCleaner_v414_macOS
                    zip -qry "$GITHUB_WORKSPACE/downloads/SafeCleaner_v414_Windows.zip" SafeCleaner_v414_Windows

                    cd "$GITHUB_WORKSPACE"
                    sha256sum \
                      downloads/SafeCleaner_v414_CrossPlatform.zip \
                      downloads/SafeCleaner_v414_macOS.zip \
                      downloads/SafeCleaner_v414_Windows.zip \
                      > downloads/SHA256SUMS.txt

                - name: Commit download packages
                  shell: bash
                  run: |
                    set -euo pipefail
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git add downloads/SafeCleaner_v414_CrossPlatform.zip \
                            downloads/SafeCleaner_v414_macOS.zip \
                            downloads/SafeCleaner_v414_Windows.zip \
                            downloads/SHA256SUMS.txt
                    if git diff --cached --quiet; then
                      echo 'Packages are already up to date.'
                      exit 0
                    fi
                    git commit -m 'release: publish v4.14 platform download packages'
                    git push
          YAML

          rm -f .github/workflows/maintenance-readme-downloads.yml

      - name: Commit maintenance result to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: restore full-resolution hero and clean maintenance files'
          git push origin HEAD:main

      - name: Delete obsolete remote branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete skin/plan-a-v414 || true
          git push origin --delete ops/readme-cleanup || true

name: Finalize repository cleanup

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'ops/readme-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove one-off maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -f .github/workflows/maintenance-readme-downloads.yml
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove one-off repository maintenance workflow'
            git push origin HEAD:main
          fi

      - name: Delete temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete ops/readme-cleanup || true

name: Bootstrap source snapshots

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/source.tar.gz.b64
          base64 -d /tmp/source.tar.gz.b64 > /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf .bootstrap

      - name: Commit source snapshots
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import all SafeCleaner source snapshots and cross-platform baseline'
          git push

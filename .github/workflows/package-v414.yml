name: Verify Windows v4.14 build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply diagnostic source fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $xamlPath = 'Windows/MainWindow.xaml'
          $xaml = Get-Content -Raw $xamlPath
          $xaml = [regex]::Replace($xaml, '(?s)\r?\n\s*<Border\.RenderTransform>\s*<ScaleTransform x:Name="Scale" ScaleX="1" ScaleY="1"/>\s*</Border\.RenderTransform>', '')
          $xaml = [regex]::Replace($xaml, '(?m)^\s*<Setter TargetName="Scale" Property="ScaleX" Value="[^"]+"/>\r?\n\s*<Setter TargetName="Scale" Property="ScaleY" Value="[^"]+"/>\r?\n', '')
          Set-Content -Path $xamlPath -Value $xaml -Encoding UTF8 -NoNewline

          $enginePath = 'Windows/ScanEngine.cs'
          $engine = Get-Content -Raw $enginePath
          if ($engine -notmatch 'using System\.IO;') {
            $engine = $engine -replace 'using System.Security;\r?\n', "using System.Security;`r`nusing System.IO;`r`n"
          }
          Set-Content -Path $enginePath -Value $engine -Encoding UTF8 -NoNewline

          $mainPath = 'Windows/MainWindow.xaml.cs'
          $main = Get-Content -Raw $mainPath
          $main = $main.Replace('var progress = new Progress<ScanProgressInfo>(p =>', 'IProgress<ScanProgressInfo> progress = new Progress<ScanProgressInfo>(p =>')
          $main = $main.Replace('var checkedItems = data.Where(x => x.Checked && x.CanDelete).ToList();', 'var selectedItems = data.Where(x => x.Checked && x.CanDelete).ToList();')
          $main = $main.Replace('long selected = checkedItems.Sum(x => x.Size);', 'long selected = selectedItems.Sum(x => x.Size);')
          $main = $main.Replace('MetricSelectedSub.Text = $"{checkedItems.Count} 项将处理";', 'MetricSelectedSub.Text = $"{selectedItems.Count} 项将处理";')
          Set-Content -Path $mainPath -Value $main -Encoding UTF8 -NoNewline

      - name: Publish self-contained executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP '${{ matrix.rid }}'
          dotnet publish 'Windows/SafeMacCleaner.Windows.csproj' `
            -c Release `
            -r '${{ matrix.rid }}' `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o $out
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed: $LASTEXITCODE" }
          $exe = Join-Path $out 'SafeMacCleanerLite.exe'
          if (-not (Test-Path $exe)) { throw "Missing executable: $exe" }
          Write-Host "PASS ${{ matrix.rid }} -> $exe"

  persist-fixes:
    needs: build-windows
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/windows-build-check-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ci/windows-build-check-2
          fetch-depth: 0

      - name: Persist the verified source fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          xaml_path = Path('Windows/MainWindow.xaml')
          xaml = xaml_path.read_text(encoding='utf-8')
          xaml = re.sub(r'\n\s*<Border\.RenderTransform>\s*<ScaleTransform x:Name="Scale" ScaleX="1" ScaleY="1"/>\s*</Border\.RenderTransform>', '', xaml, flags=re.S)
          xaml = re.sub(r'^\s*<Setter TargetName="Scale" Property="ScaleX" Value="[^"]+"/>\s*\n\s*<Setter TargetName="Scale" Property="ScaleY" Value="[^"]+"/>\s*\n', '', xaml, flags=re.M)
          if 'TargetName="Scale"' in xaml or 'x:Name="Scale"' in xaml:
              raise RuntimeError('XAML Scale cleanup incomplete')
          xaml_path.write_text(xaml, encoding='utf-8')

          engine_path = Path('Windows/ScanEngine.cs')
          engine = engine_path.read_text(encoding='utf-8')
          if 'using System.IO;' not in engine:
              engine = engine.replace('using System.Security;\n', 'using System.Security;\nusing System.IO;\n', 1)
          engine_path.write_text(engine, encoding='utf-8')

          main_path = Path('Windows/MainWindow.xaml.cs')
          main = main_path.read_text(encoding='utf-8')
          main = main.replace('var progress = new Progress<ScanProgressInfo>(p =>', 'IProgress<ScanProgressInfo> progress = new Progress<ScanProgressInfo>(p =>', 1)
          main = main.replace('var checkedItems = data.Where(x => x.Checked && x.CanDelete).ToList();', 'var selectedItems = data.Where(x => x.Checked && x.CanDelete).ToList();', 1)
          main = main.replace('long selected = checkedItems.Sum(x => x.Size);', 'long selected = selectedItems.Sum(x => x.Size);', 1)
          main = main.replace('MetricSelectedSub.Text = $"{checkedItems.Count} 项将处理";', 'MetricSelectedSub.Text = $"{selectedItems.Count} 项将处理";', 1)
          main_path.write_text(main, encoding='utf-8')

      - name: Restore formal packaging workflow and push branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/package-v414.yml > .github/workflows/package-v414.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Windows/MainWindow.xaml Windows/MainWindow.xaml.cs Windows/ScanEngine.cs .github/workflows/package-v414.yml
          git commit -m 'fix: make Windows WPF source compile on .NET 8'
          git push origin HEAD:ci/windows-build-check-2
